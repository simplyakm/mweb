<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>simplyakm</title>
    <meta
      name="description"
      content="Independent software and browser tools by simplyakm, including SaveShot for Chrome."
    />
    <link rel="canonical" href="https://simplyakm.com/" />
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f8fafc;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --accent: #1a73e8;
        --accent-hover: #1558b0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --surface: #111827;
          --border: #1f2937;
          --text: #f8fafc;
          --muted: #94a3b8;
          --accent: #60a5fa;
          --accent-hover: #93c5fd;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding: 72px 24px 48px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 36px;
        font-size: 16px;
        color: var(--muted);
      }
      .section-title {
        margin: 0 0 14px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .card {
        display: block;
        padding: 20px 22px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
      }
      .card-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
      }
      .card-url {
        font-size: 13px;
        color: var(--accent);
        font-weight: 500;
      }
      .card-desc {
        margin: 0;
        font-size: 14.5px;
        color: var(--muted);
      }
      footer {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding: 20px 24px 36px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 13px;
        color: var(--muted);
      }
      footer a {
        color: var(--muted);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      .footer-links {
        display: flex;
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>simplyakm</h1>
      <p class="lead">Fast, privacy-first browser tools built without clutter or tracking.</p>

      <h2 class="section-title">Projects</h2>
      <a class="card" href="https://saveshot.simplyakm.com/">
        <div class="card-head">
          <span class="card-title">SaveShot</span>
          <span class="card-url">saveshot.simplyakm.com -&gt;</span>
        </div>
        <p class="card-desc">
          Capture, annotate, redact, and autosave Chrome screenshots straight to your Google Drive with instant shareable links.
        </p>
      </a>
    </main>

    <footer>
      <span>simplyakm.com</span>
      <div class="footer-links">
        <a href="https://saveshot.simplyakm.com/privacy.html">SaveShot Privacy</a>
        <a href="https://x.com/_simplyakm" rel="noopener noreferrer">@_simplyakm</a>
      </div>
    </footer>
  </body>
</html>
